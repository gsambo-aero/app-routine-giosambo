<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Routine">
  <meta name="theme-color" content="#0f0f10">
  <title>App Routine Giosambo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- Vista Sveglia -->
    <section id="vista-sveglia" class="vista">
      <header class="titolo">
        <h1>Sveglia</h1>
      </header>

      <form id="form-sveglia" class="card">
        <label class="campo">
          <span>Ora</span>
          <input type="time" id="sveglia-ora" value="07:00" required>
        </label>
        <label class="campo">
          <span>Nome</span>
          <input type="text" id="sveglia-nome" placeholder="Sveglia" maxlength="40" autocomplete="off">
        </label>
        <button type="submit" class="btn-primario">Imposta sveglia</button>
      </form>

      <p id="sveglia-esito" class="esito"></p>
      <p class="nota">La sveglia viene creata nell'app Orologio. Per disattivarla o eliminarla usa Orologio.</p>
    </section>

    <!-- Vista Palestra -->
    <section id="vista-palestra" class="vista">
      <header class="titolo">
        <h1>Palestra</h1>
      </header>
      <div class="vuoto">Qui troverai allenamenti, esercizi e storico.</div>
    </section>
  </main>

  <!-- Barra delle schede in basso -->
  <nav class="tabbar">
    <button class="tab" data-vista="sveglia">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13" r="8"/>
        <path d="M12 9v4l2 2"/>
        <path d="M5 3L2 6"/>
        <path d="M22 6l-3-3"/>
      </svg>
      <span>Sveglia</span>
    </button>
    <button class="tab" data-vista="palestra">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 7v10"/>
        <path d="M18 7v10"/>
        <path d="M3 10v4"/>
        <path d="M21 10v4"/>
        <path d="M6 12h12"/>
      </svg>
      <span>Palestra</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
