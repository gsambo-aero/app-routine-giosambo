<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Routine">
  <meta name="theme-color" content="#0f0f10">
  <title>App Routine Giosambo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <!-- ========== Vista Sveglia ========== -->
    <section id="vista-sveglia" class="vista">
      <header class="titolo">
        <h1>Sveglia</h1>
      </header>

      <form id="form-sveglia" class="card">
        <label class="campo">
          <span>Ora</span>
          <input type="time" id="sveglia-ora" value="07:00" required>
        </label>
        <label class="campo">
          <span>Nome</span>
          <input type="text" id="sveglia-nome" placeholder="Sveglia" maxlength="40" autocomplete="off">
        </label>
        <button type="submit" class="btn-primario">Imposta sveglia</button>
      </form>

      <p id="sveglia-esito" class="esito"></p>
      <p class="nota">La sveglia viene creata nell'app Orologio. Per disattivarla o eliminarla usa Orologio.</p>
    </section>

    <!-- ========== Vista Palestra ========== -->
    <section id="vista-palestra" class="vista">
      <header class="titolo">
        <h1>Palestra</h1>
      </header>

      <!-- Stato 1: nessun allenamento in corso -->
      <div id="palestra-inattivo" class="card">
        <button id="btn-inizia" class="btn-primario btn-grande">Inizia allenamento</button>
      </div>

      <!-- Stato 2: allenamento in corso -->
      <div id="palestra-incorso" class="card centro" hidden>
        <span class="etichetta">Allenamento in corso</span>
        <div id="cronometro" class="cronometro">00:00:00</div>
        <span id="inizio-alle" class="testo-sec"></span>
        <button id="btn-apri-hevy" class="btn-secondario">Apri Hevy</button>
        <button id="btn-termina" class="btn-primario">Termina allenamento</button>
        <button id="btn-annulla" class="btn-testo btn-rosso">Annulla allenamento</button>
      </div>

      <!-- Stato 3: salvataggio dopo "Termina" -->
      <form id="palestra-salva" class="card" hidden>
        <span class="etichetta">Riepilogo</span>
        <div id="riepilogo-durata" class="riepilogo-durata"></div>
        <label class="campo">
          <span>Nome</span>
          <input type="text" id="allenamento-nome" list="nomi-allenamenti" placeholder="es. Push, Gambe" maxlength="40" autocomplete="off" required>
        </label>
        <datalist id="nomi-allenamenti"></datalist>
        <label class="campo">
          <span>Nota</span>
          <textarea id="allenamento-nota" rows="3" maxlength="300" placeholder="Opzionale"></textarea>
        </label>
        <button type="submit" class="btn-primario">Salva allenamento</button>
        <button type="button" id="btn-riprendi" class="btn-testo">Torna all'allenamento</button>
      </form>

      <!-- Storico -->
      <h2 class="sezione">Storico</h2>
      <ul id="storico" class="lista"></ul>
      <p id="storico-vuoto" class="nota">Nessun allenamento salvato.</p>
    </section>
  </main>

  <!-- Barra delle schede in basso -->
  <nav class="tabbar">
    <button class="tab" data-vista="sveglia">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13" r="8"/>
        <path d="M12 9v4l2 2"/>
        <path d="M5 3L2 6"/>
        <path d="M22 6l-3-3"/>
      </svg>
      <span>Sveglia</span>
    </button>
    <button class="tab" data-vista="palestra">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 7v10"/>
        <path d="M18 7v10"/>
        <path d="M3 10v4"/>
        <path d="M21 10v4"/>
        <path d="M6 12h12"/>
      </svg>
      <span>Palestra</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
